<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="utf-8" />

  <meta http-equiv="refresh" content="60"> -->
	<title>StormReader 0.2</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet"></link><link rel='stylesheet' href='./style.css' type='text/css' media='all' />
</head>
  <body>
    <!-- DISPLAY HTML -->
    <div id="container">
      <div id="scroll0" class="scroller"></div>
      <div id="scroll1" class="scroller"></div>
      <div id="scroll2" class="scroller"></div>
      <div id="scroll3" class="scroller"></div>
      <div id="scroll4" class="scroller"></div>
      <div id="scroll5" class="scroller"></div>
      <div id="scroll6" class="scroller"></div>
      <div id="scroll7" class="scroller"></div>
      <div id="scroll8" class="scroller"></div>
      <div id="scroll9" class="scroller"></div>
      <div id="scroll10" class="scroller"></div>
      <div id="scroll11" class="scroller"></div>
      <div id="scroll12" class="scroller"></div>
      <div id="scroll13" class="scroller"></div>
      <div id="scroll14" class="scroller"></div>
      <div id="scroll15" class="scroller"></div>
      <div id="scroll16" class="scroller"></div>
      <div id="mask"></div>
    </div>
    <!-- SCRIPT -->
    <script type="module">
      // CONFIG
      import {config, createContent, startAllAnimations, runPreJumpWordTransition, logDebug} from "./storm.js";
      const wordsPerLine = 14, perWordScrollingDuration = 1100; // millis: controls speed
      const charIndexes = Array(config.numOfLines);

      function getScrollers() {
        const scrollers = [];
        for (let i = 0; i < config.numOfLines; i++) {
          scrollers.push(document.getElementById('scroll' + i));
        }
        return scrollers;
      }

      function getRandomStartIndexAwayFrom(currentIndex) {
        if (config.numOfChars < 2) return 0;
        const minDistance = Math.max(1, Math.floor(config.numOfChars * 0.2));
        let candidate = Math.floor(Math.random() * config.numOfChars);

        if (Number.isInteger(currentIndex)) {
          let attempts = 0;
          while (attempts < 20) {
            const diff = Math.abs(candidate - currentIndex);
            const wrappedDiff = Math.min(diff, config.numOfChars - diff);
            if (wrappedDiff >= minDistance) {
              break;
            }
            candidate = Math.floor(Math.random() * config.numOfChars);
            attempts++;
          }
        }

        return candidate;
      }

      function repopulateScrollersFromRandomPoint(scrollers, startIndex = -1) {
        let charIndex = startIndex;
        for (let i = 0; i < config.numOfLines; i++) {
          scrollers[i].innerHTML = "";
          charIndex = createContent(charIndex, scrollers[i]);
          charIndexes[i] = charIndex;
        }
      }
      // LOAD THE TEXT
        // ==================================================
        // Downloaded on: 10/08/2025, 11:20:29 PM
        // Total messages: 5192
        // Model: deepseek/deepseek-chat-v3.1:free
        // Persona: typhoon
        // Generations: 10000
        // Max Tokens: 300
        // Temperature: 0.7
        // Frequency Penalty: 1.2
        // Presence Penalty: 0.8
        // Context Strategy: context-halving
        // Context Window Size: 48552
        // FILE: chat_history_2025-10-08T23-20-29_deepseek_typhoon_tags_contexthalving.txt
      window.isAnimating = true;
      window.animationFrames = Array(config.numOfLines).fill(null);
      // Fetch the text file      
      fetch("./stormvoice.txt")
        .then(response => response.text())
        .then(text => {
          config.generatedText = text.split(""); // /\s+/;
          config.numOfChars = config.generatedText.length;
          main();
        })
        .catch(error => console.error("Error loading stormvoice.txt:", error));
      // MAIN FUNCTION
      async function main() {
        logDebug("Main function started");
        const scrollers = getScrollers();
        let lastStartIndex = null;
        let isPreparingJump = false;

        // Initial population starts from a random point in stormvoice.txt
        lastStartIndex = getRandomStartIndexAwayFrom(lastStartIndex);
        repopulateScrollersFromRandomPoint(scrollers, lastStartIndex);
        // return; // DEBUG
        // Start the scrolling animation loop
        startAllAnimations(charIndexes, scrollers);
        logDebug(`[reset] interval: ${config.resetScrollersEverySeconds}s`);

        // Periodically jump to a new random source position.
        setInterval(async () => {
          if (isPreparingJump) return;
          isPreparingJump = true;

          try {
            await runPreJumpWordTransition(scrollers);

            lastStartIndex = getRandomStartIndexAwayFrom(lastStartIndex);
            repopulateScrollersFromRandomPoint(scrollers, lastStartIndex);
            logDebug(`[reset] jumped to index ${lastStartIndex}`);
          } finally {
            isPreparingJump = false;
          }
        }, config.resetScrollersEverySeconds * 1000);
        //
        // let prevWord = char;
        // Start scrolling
        // for (let i = numOfLines - 1; i > -1; i--) {
        //   if (i === numOfLines - 1) {
        //     // last line so get the next char from the text
        //     scrollFirstWord(document.getElementById("scroll" + i), getNextSourceWord, prevWord, i, generatedText, charIndex, perWordScrollingDuration);
        //   } else {
        //     // other lines get their next char from the line below
        //     scrollFirstWord(document.getElementById("scroll" + i), getHeadWord, prevWord, i, [], charIndex, perWordScrollingDuration);
        //   }
        // }
      }
      // END MAIN
    </script>
  </body>
</html>
