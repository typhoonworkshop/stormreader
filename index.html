<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="utf-8" />
  <!-- meta tag below for demo only to refresh page every 2 minutes because
   this will send the visualization to a random point in the source text -->
  <meta http-equiv="refresh" content="60">
	<title>Storm Reader</title>
	<link rel='stylesheet' href='./style.css' type='text/css' media='all' />
</head>
  <body>
    <!-- DISPLAY HTML -->
    <div id="container">
      <div id="scroll0" class="scroller"></div>
      <div id="scroll1" class="scroller"></div>
      <div id="scroll2" class="scroller"></div>
      <div id="scroll3" class="scroller"></div>
      <div id="scroll4" class="scroller"></div>
      <div id="scroll5" class="scroller"></div>
      <div id="scroll6" class="scroller"></div>
      <div id="mask"></div>
    </div>
    <!-- SCRIPT -->
    <script type="module">
      // CONFIG
      import {scrollFirstWord, spanify, getHeadWord, getNextSourceWord, longTail} from "./storm.js";
      const numOfLines = 7, wordsPerLine = 14, perWordScrollingDuration = 1100; // millis: controls speed
      // LOAD THE TEXT
        // ==================================================
        // Downloaded on: 10/08/2025, 11:20:29 PM
        // Total messages: 5192
        // Model: deepseek/deepseek-chat-v3.1:free
        // Persona: typhoon
        // Generations: 10000
        // Max Tokens: 300
        // Temperature: 0.7
        // Frequency Penalty: 1.2
        // Presence Penalty: 0.8
        // Context Strategy: context-halving
        // Context Window Size: 48552
        // FILE: chat_history_2025-10-08T23-20-29_deepseek_typhoon_tags_contexthalving.txt
      let generatedText = "";
      
      fetch("./stormvoice.txt")
        .then(response => response.text())
        .then(text => {
          generatedText = text;
          main(generatedText);
        })
        .catch(error => console.error("Error loading stormvoice.txt:", error));
      // MAIN FUNCTION
      let word = "";
      async function main(generatedText) {
        console.log("Main function started");
        generatedText = generatedText.split(/\s+/);
        let numOfWords = generatedText.length;
        let wordIndex = Math.floor(Math.random() * numOfWords);
        // populate the scroll elements with words
        for (let i = 0; i < numOfLines; i++) {
          let elem = document.getElementById("scroll" + i);
          let html = "";
          for (let j = 0; j < wordsPerLine; j++) {
            word = generatedText[wordIndex];
            html += spanify(word);
            wordIndex = (wordIndex + 1) % numOfWords;
          }
          // console.log(html); // DEBUG
          // add the long tail to allow smoother scrolling
          elem.innerHTML = html + longTail;
        }
        // return; // DEBUG
        let prevWord = word;
        // Start scrolling
        for (let i = numOfLines - 1; i > -1; i--) {
          if (i === numOfLines - 1) {
            // last line so get the next word from the text
            scrollFirstWord(document.getElementById("scroll" + i), getNextSourceWord, prevWord, i, generatedText, wordIndex, perWordScrollingDuration);
          } else {
            // other lines get their next word from the line below
            scrollFirstWord(document.getElementById("scroll" + i), getHeadWord, prevWord, i, [], wordIndex, perWordScrollingDuration);
          }
        }
      }
    </script>
  </body>
</html>
